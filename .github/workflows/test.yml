name: Windows tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Compile Python sources
        run: python -m py_compile meter.pyw titlebar_meter.py meter_core.py window_anchor.py
      - name: Validate helper syntax
        run: node --check wb_credits_helper.cjs
      - name: Unit and isolated native-window tests
        run: python -m unittest test_meter test_native_lifecycle -v
